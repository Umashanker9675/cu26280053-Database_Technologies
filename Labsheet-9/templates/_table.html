<table>
  <thead>
    <tr><th>Student ID</th><th>Name</th><th>Age</th><th>Gender</th><th>Department</th><th>Marks</th></tr>
  </thead>
  <tbody>
    {% for s in students %}
    <tr>
      <td>{{ s.student_id }}</td><td>{{ s.name }}</td><td>{{ s.age }}</td>
      <td>{{ s.gender }}</td><td>{{ s.department }}</td><td>{{ s.marks }}</td>
    </tr>
    {% else %}
    <tr><td colspan="6">No records found.</td></tr>
    {% endfor %}
  </tbody>
</table>
