{% extends "base.html" %}
{% block content %}
<h2>Update Student</h2>
<form method="POST" class="card">
  <input type="hidden" name="action" value="load">
  <label for="sid_load">Student ID</label>
  <input type="number" id="sid_load" name="student_id" value="{{ student.student_id if student else '' }}" required>
  <button type="submit">Load Student</button>
</form>

{% if student %}
<form method="POST" class="card">
  <input type="hidden" name="action" value="save">
  <input type="hidden" name="student_id" value="{{ student.student_id }}">

  <label>Name</label>
  <input type="text" name="name" value="{{ student.name }}" required>
  <label>Age</label>
  <input type="number" name="age" value="{{ student.age }}" required>
  <label>Department</label>
  <input type="text" name="department" value="{{ student.department }}" required>
  <label>Marks</label>
  <input type="number" name="marks" step="0.01" value="{{ student.marks }}" required>
  <button type="submit">Update</button>
</form>
{% endif %}
{% endblock %}
